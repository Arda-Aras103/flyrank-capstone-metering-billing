services:
  postgres:
    image: postgres:16-alpine
    container_name: flyrank-metering-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metering_billing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metering_billing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
